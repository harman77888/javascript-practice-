<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    // functions

    // simple functions

    function hye() {
      console.log("Hello World");
    }
    hye();

    function sum() {
      a = 11;
      b = 30;
      let c = a + b;
      console.log(c);
    }
    sum();

    function num() {
      even = 20;
      let n = even % 2 === 0 ? "even" : "odd";
      console.log(n);
    }
    num();

    // functions with parameters and arguments

    function print(a) {
      console.log(a);
    }
    print(55);

    function add(a, b, c) {
      d = a + b + c;
      console.log(d);
    }
    add(55, 4, 60);

    function square(m) {
      n = m * m;
      console.log(n);
    }
    square(12);

    function largest(a, b) {
      big = a < b ? "largest" : "smaller";
      console.log(big);
    }
    largest(22, 31);

    function sub(a, b) {
      m = a - b;
      console.log(m);
    }
    sub(20, 11);

    function divide(a, b) {
      e = a / b;
      console.log(e);
    }
    divide(20, 5);

    function multiply(a, b) {
      f = a * b;
      console.log(f);
    }
    multiply(22, 7);

    fname = () => {
      alert("Harmanpreet Singh");
    };
    fname();

    function cube(g) {
      h = g * g * g;
      console.log(h);
    }
    cube(12);

    function rectangle(length, width) {
      area = length * width;
      console.log(area);
    }
    rectangle(11, 6);

    function zero() {
     let positive=1;
     negative=(positive>=0)?'positive':'Negative';
     console.log(negative);
    }zero();
  </script>
</html>
