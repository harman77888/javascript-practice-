<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- condition practice -->

    <script>

        // if condition

        a=-10;
        if(a>=0){
            console.log("Positive")
        }else{
            console.log("Negative")
        }

        b=101;
        if(b>=100){
            console.log("Greater then 100")
        }else{
            console.log("Smaller then 100")
        }

        age=19;
        if(age>=18){
            console.log("Eligible to Vote")
        }else{
            console.log("Not Eligible")
        }

        str=""
        if(!str){
            console.log("String is empty")
        }else{
            console.log("filled")
        }

        num=31;
        if(num>=35){
            console.log("Pass")
        }else{
            console.log("Fail")
        }


        // If-else conditions


        c=21;
        if(c%2===0){
            console.log("Even")
        }else{
            console.log("Odd")
        }

        temp=20;
        if(temp>=30){
            console.log("Hot")
        }else{
            console.log("Cold")
        }

        d=101;
        if(d%5===0){
            console.log("Divisible")
        }else{
            console.log("Not Divisible")
        }

        e=17;
        if(e>=18){
            console.log("Elder")
        }else{
            console.log("Minor")
        }

        lang="String"
        if(lang="Javascript"){
            console.log("Correct Language")
        }else{
            console.log("Try Again")
        }

        // If-else if constions

        f=91;
        if(f>=90){
            console.log("A")
        }else if(f>=70){
            console.log("B")
        }else if(f>=50){
            console.log("C")
        }else{
            console.log("Fail")
        }

        g=-1;
        if(g>=1){
            console.log("Positive")
        }else if(g==0){
            console.log("Zero")
        }else{
            console.log("Negative")
        }

        tym=24;
        if(tym<=11){
            console.log("Good Morning")
        }else if(tym>=12 && tym<=17){
            console.log("Good Afternoon")
        }else if(tym>=18 && tym<=23){
            console.log("Good Evening")     
        }else{
            console.log("Good Night")
        }

        h=60;
        if(h<13){
            console.log("Child")
        }else if(h>=13 && h<=19){
            console.log("teenager")
        }else if(h>=20 && h<=59){
            console.log("Adult")
        }else{
            console.log("Senior Citizen")
        }

        // Mini practice

        i=50;
        j=20;
        if(i>=j){
            console.log("Greater")
        }else{
            console.log("Smaller")
        }

        k=15
        if(k%3===0 && k%5===0){
            console.log("Divisible")
        }else{
            console.log("Not Divisible")
        }

        userName="Harmanpreet Singh1"
        password="harman@123"
        if(userName==="Harmanpreet Singh" && password==="harman@123"){
            console.log("Login Successfully")
        }else{
            console.log("Try Again")
        }

        days=365;
        if( days==366){
            console.log("Leap Year")
        }else{
            console.log("Year")
        }

        l=8;
        m=6;
        n=7;
        if(l>m){
            console.log("Greater ")
        }else if(l>n){
            console.log("Greater")
        }else{
            console.log("Smaller")
        }

        
    </script>
</body>
</html>
