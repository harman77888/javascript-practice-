<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        display: flex;
        justify-content: center;
      }
      .btn {
        width: 200px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin-top: 10px;
        margin-left: 7px;
      }
      .dis {
        padding: 20px;
        width: 192px;
        background-color: black;
        color: white;
        font-size: 30px;
        height: 50px;
      }
      .cal {
        height: 40px;
        width: 40px;
        background-color: black;
        color: white;
        font-size: 20px;
        text-align: center;
        border-radius: 5px;
      }
      .calculator {
        border: 1px solid black;
        width: 210px;
        text-align: center;
      }
      .dis {
        margin-top: 10px;
      }

      .btn1 {
        grid-column: span 2;
        width: 90px;
      }
    </style>
  </head>
  <body>

    <!-- make a calculator without using script fully functional -->
     
    <div class="container">
      <form action="">


        <div class="calculator">
          <input type="text" name="display" class="dis"  placeholder="00"/>
          <div class="btn">
            <input
              type="button"
              value="AC"
              class="cal"
              onclick="display.value=' '"
              id="clear"
            />
            <input
              type="button"
              value="DE"
              class="cal"
              onclick="display.value=display.value.slice(0, -1)"
              name="DE"
            />
            <input
              type="button"
              value="."
              class="cal"
              onclick="display.value+='.'"
            />
            <input
              type="button"
              value="/"
              class="cal"
              onclick="display.value+='/'"
            />
            <input
              type="button"
              value="7"
              class="cal"
              onclick="display.value+='7'"
            />
            <input
              type="button"
              value="8"
              class="cal"
              onclick="display.value+='8'"
            />
            <input
              type="button"
              value="9"
              class="cal"
              onclick="display.value+='9'"
            />
            <input
              type="button"
              value="*"
              class="cal"
              onclick="display.value+='*'"
            />
            <input
              type="button"
              value="4"
              class="cal"
              onclick="display.value+='4'"
            />
            <input
              type="button"
              value="5"
              class="cal"
              onclick="display.value+='5'"
            />
            <input
              type="button"
              value="6"
              class="cal"
              onclick="display.value+='6'"
            />
            <input
              type="button"
              value="-"
              class="cal"
              onclick="display.value+='-'"
            />
            <input
              type="button"
              value="1"
              class="cal"
              onclick="display.value+='1'"
            />
            <input
              type="button"
              value="2"
              class="cal"
              onclick="display.value+='2'"
            />
            <input
              type="button"
              value="3"
              class="cal"
              onclick="display.value+='3'"
            />
            <input
              type="button"
              value="+"
              class="cal"
              onclick="display.value+='+'"
            />
            <input
              type="button"
              value="00"
              class="cal"
              onclick="display.value+='00'"
            />
            <input
              type="button"
              value="0"
              class="cal"
              onclick="display.value+='0'"
            />
  
            <input
              type="button"
              value="="
              class="cal btn1"
              onclick="display.value=eval(display.value)"
            />
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
