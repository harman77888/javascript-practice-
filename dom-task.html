<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Dom</title>
  </head>
  <body>
    <input type="number" id="number" placeholder="number" />
    <input type="number" id="num" placeholder="number" />
    <p id="para"></p>
    <!-- Create a simple calculator using HTML, CSS, and JavaScript. Add two input fields for taking two numbers as input. Create four buttons — Add, Subtract, Multiply, and Divide. When the user clicks any button, perform the corresponding operation on the two input values and display the result below the buttons. -->
    <button onclick="addOn()">+</button>
    <button onclick="subOn()">-</button>
    <button onclick="multiply()">*</button>
    <button onclick="divide()">/</button>

    <!-- Create a registration form with three input fields: Name, Password, and Confirm Password. Add a Submit button. When the user clicks the button, check whether the Password and Confirm Password values are the same or different. Display an appropriate message such as “Password matched” or “Password does not match” on the webpage. -->

    <input type="text" placeholder="Name" id="name" />
    <input type="text" placeholder="password" id="password" />
    <input type="text" placeholder="Confirm Password" id="cPassword" />
    <button onclick="submitData()">Submit</button>
    <p id="submit"></p>

    <!--  Create a YouTube video search bar using HTML, CSS, and JavaScript. The search interface should contain: One input field where the user can enter a keyword. One Search button. -->
    <form action="https://www.youtube.com/results" >
      <input type="text" id="searchBar" placeholder="Search Youtube Video" name="search_query"/>
      <button>Search</button>
    </form>

    <!--  Create an input field where the user can enter any value. When the user clicks a button, check whether the entered value is a number or a string and display the result on the webpage. -->
    <input type="text" id="check" />
    <button onclick="checkOn()">Check</button>
    <p id="data"></p>

    <script>
      
      function addOn() {
        let number = document.getElementById("number").value;
        let num = document.getElementById("num").value;
        let sum = parseInt(number) + parseInt(num);
        document.getElementById("para").innerHTML = sum;
      }
      function subOn() {
        let number = document.getElementById("number").value;
        let num = document.getElementById("num").value;
        let sum = number - num;
        document.getElementById("para").innerHTML = sum;
      }
      function multiply() {
        let number = document.getElementById("number").value;
        let num = document.getElementById("num").value;
        let sum = number * num;
        document.getElementById("para").innerHTML = sum;
      }
      function divide() {
        let number = document.getElementById("number").value;
        let num = document.getElementById("num").value;
        let sum = number / num;
        document.getElementById("para").innerHTML = sum;
      }
      
      function checkOn() {
        let check = document.getElementById("check").value;
        let isNumber = !isNaN(check) && check !== "";
        if (isNumber) {
          document.getElementById("data").innerHTML = "Number";
        } else {
          document.getElementById("data").innerHTML = "String";
        }
      }
      function submitData() {
        let name = document.getElementById("name").value;
        let pass = document.getElementById("password").value;
        let cPass = document.getElementById("cPassword").value;

        if (!name || !pass || !cPass) {
          document.getElementById("submit").innerHTML =
            "please fill the all fields ";
          return false;
        }
        if (pass != cPass) {
          document.getElementById("submit").innerHTML = "password not matched ";
          return false;
        }
        if (pass == cPass) {
          document.getElementById("submit").innerHTML = name;
          return false;
        }
        return true;
      }

      //     document.getElementById("data").innerHTML = "Number";
      //   }else {
      //     document.getElementById("data").innerHTML = "String";
      //   }
      // }


    </script>
  </body>
</html>
